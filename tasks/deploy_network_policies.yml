# Compute the effective namespace list.
#
# whitelist mode (default): namespaces: lists the namespaces to manage.
# blacklist mode:           policies apply to ALL cluster namespaces except
#                           system_namespaces and excluded_namespaces.

- name: query all namespaces (blacklist mode)
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
  register: _np_all_namespaces
  when: _k3s_cfg.network_policies.mode | default('whitelist') == 'blacklist'

- name: compute effective namespace list
  set_fact:
    _np_namespaces: "{{_k3s_cfg.network_policies | k3s_np_effective_namespaces(
        _np_all_namespaces.resources | default([]) | map(attribute='metadata.name') | list
      )}}"

# Fail fast if any target namespace is Terminating — creating resources there
# returns 403 and usually means a previous test namespace is stuck because an
# APIService (e.g. a cert-manager webhook) is unavailable.
- name: query namespace statuses
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
    name: "{{item}}"
  loop: "{{_np_namespaces}}"
  register: _np_namespace_statuses

- name: check for terminating namespaces
  set_fact:
    _np_terminating: "{{ _np_namespace_statuses.results | default([]) | selectattr('resources', 'defined') | map(attribute='resources') | flatten | selectattr('status.phase', 'equalto', 'Terminating') | map(attribute='metadata.name') | list }}"

- name: fail fast if any namespace is terminating
  fail:
    msg: >-
      Namespace(s) in Terminating state: {{ _np_terminating | join(', ') }}.
      Network policy deployment blocked — creating resources in a Terminating namespace returns 403.
      Common cause: an APIService is unavailable, preventing namespace deletion from completing.
      Diagnose:  kubectl get apiservice | grep -v True
                 kubectl get namespace {{ _np_terminating | first }}
      Fix options (pick one):
        a) Fix the unavailable APIService (check its pod in the SERVICE column namespace)
        b) Delete the broken APIService if it is not needed:
             kubectl delete apiservice <name-from-diagnose>
        c) Force-remove the namespace (workaround, does not fix root cause):
             kubectl patch namespace {{ _np_terminating | first }} -p '{"metadata":{"finalizers":[]}}' --type=merge
  when: _np_terminating | length > 0

- name: query ansible-managed network policies
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{_ns}}"
    label_selectors:
      - "configurator=ansible"
  loop: "{{_np_namespaces}}"
  loop_control:
    loop_var: _ns
  register: _np_queries

- name: index ansible-managed network policies by namespace/name
  set_fact:
    _np_existing: >-
      {{ _np_queries.results | map(attribute='resources') | flatten
         | k3s_ns_resource_index }}

- name: build desired network policies
  set_fact:
    _np_desired: "{{ lookup('template', 'network-policies.yaml.j2') | from_yaml_all | select('mapping') | list }}"
  vars:
    _np_cfg: "{{_k3s_cfg.network_policies}}"

- name: deploy network policies
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_np_resource}}"
  loop: "{{_np_desired}}"
  loop_control:
    loop_var: _np_resource
  when: >
    _np_resource | k3s_content_changed(
      _np_existing[_np_resource.metadata.namespace ~ '/' ~ _np_resource.metadata.name] | default(none))
  changed_when: not (_np_test_mode | default(false) | bool)

- name: remove stale ansible-managed network policies
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{item.metadata.namespace}}"
  loop: "{{_np_queries.results | map(attribute='resources') | flatten
            | rejectattr('metadata.name', 'in', _k3s_cfg.network_policies | k3s_np_expected_names)
            | list}}"
  loop_control:
    label: "{{item.metadata.namespace}}/{{item.metadata.name}}"

# Namespaces moved into system_namespaces or excluded_namespaces are no longer
# in the effective namespace list, so the stale cleanup above never visits them.
# Explicitly remove any ansible-managed policies left behind in those namespaces.
- name: query ansible-managed policies in excluded/system namespaces
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{_ex_ns}}"
    label_selectors:
      - "configurator=ansible"
  loop: >-
    {{
      (_k3s_cfg.network_policies.system_namespaces | default([])) +
      (_k3s_cfg.network_policies.excluded_namespaces | default([]))
    }}
  loop_control:
    loop_var: _ex_ns
  register: _np_excluded_queries
  failed_when: false

- name: remove leftover ansible-managed policies from excluded/system namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{item.metadata.namespace}}"
  loop: "{{_np_excluded_queries.results | map(attribute='resources') | flatten
            | rejectattr('metadata.name', 'in', _k3s_cfg.network_policies | k3s_np_expected_names_system)
            | list}}"
  loop_control:
    label: "{{item.metadata.namespace}}/{{item.metadata.name}}"
