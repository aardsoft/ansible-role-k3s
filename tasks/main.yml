- include_tasks: setup_facts.yml

# Phase model for k3s deployment. This allows us to split deployment into several
# phases - and also helps with bootstrap: We can just bring the core cluster up,
# verify, and only then add the next layer of services on top.
# Defaults to all phases unless explicitly overridden or k3s_bootstrap_only is set.
- set_fact:
    _k3s_phases: "{{ ['bootstrap', 'infrastructure', 'applications'] if not (k3s_bootstrap_only | default(false)) else ['bootstrap'] }}"
  when: _k3s_phases is undefined

- include_tasks: k3s_setup.yml
  when: >
    _k3s_cfg is defined and
    'bootstrap' in _k3s_phases

# Write Traefik HelmChartConfig on all server nodes as soon as the traefik key
# is defined so entrypoints and TLS are in place before other deployments run.
# File is written to every server node; kubectl apply is gated to first server
# only (in manage_server_manifest.yml).
- name: manage Traefik configuration manifest
  include_tasks: manage_server_manifest.yml
  vars:
    _manifest:
      key: traefik-ansible-label.yaml
      value:
        template: traefik-ansible-label.j2
  when: >
    _k3s_cfg is defined and
    _k3s_cfg.traefik is defined and
    k3s_role|default('agent') == 'server'

# for leap we don't have the multiple python versions yet, so just stick
# with the generic 3 package
- set_fact:
    _python_version: 3

- set_fact:
    _python_version: "{{python_version}}"
  when: >
    python_version is defined and
    ansible_distribution != "openSUSE Leap"

- set_fact:
    role_packages:
      - "python{{_python_version}}-kubernetes"
      - nfs-client
      - open-iscsi
      - bash-completion
      - helm
      - helm-bash-completion
      - helmfile
      - helmfile-bash-completion
  when: >
    (ansible_os_family == "Suse" or
    ansible_os_family == "openSUSE MicroOS")

- include_role:
    name: data-utilities
    tasks_from: install_packages
  when: role_packages is defined

- include_tasks: test_cluster.yml
  when: >
    _k3s_cfg is defined and
    _k3s_cfg.test_cluster is defined and
    _k3s_cfg.test_cluster == true and
    k3s_role|default('agent') == 'server'

- include_tasks: test_service_reachability.yml
  when: >
    _k3s_cfg is defined and
    _k3s_cfg.test_cluster_services is defined and
    _k3s_cfg.test_cluster_services == true and
    k3s_role|default('agent') == 'server'
  run_once: true

- include_tasks: deploy_infrastructure.yml
  when: >
    _k3s_cfg is defined and
    k3s_role|default('agent') == 'server' and
    _first_server == true and
    'infrastructure' in _k3s_phases

- include_tasks: deploy_applications.yml
  when: >
    _k3s_cfg is defined and
    k3s_role|default('agent') == 'server' and
    _first_server == true and
    'applications' in _k3s_phases

# Workload reachability probes (network_policies.reachability_tests +
# cert-manager sidecarURL) run AFTER workload deployment: on fresh clusters
# the probed services don't exist when the in-infrastructure policy tests
# run.  Standalone kubectl-run probes, no test namespace needed.
- include_tasks: test_workload_reachability.yml
  when: >
    _k3s_cfg is defined and
    k3s_role|default('agent') == 'server' and
    _first_server == true and
    'applications' in _k3s_phases and
    _k3s_cfg.network_policies is defined and
    (_k3s_cfg.network_policies.run_tests | default(false)) | bool

# those tasks could be anything - so they're run against all cluster members.
# it's expected that the included tasks limit to roles or specific cluster
# members
- name: include additional tasks (cluster config)
  include_tasks: "tasks/{{_tasks}}.yml"
  with_items: "{{_k3s_cfg.extra_tasks}}"
  loop_control:
    loop_var: _tasks
  when: >
    _k3s_cfg.extra_tasks is defined and
    'applications' in _k3s_phases

- name: include additional tasks (global)
  include_tasks: "tasks/{{_tasks}}.yml"
  with_items: "{{k3s_extra_tasks}}"
  loop_control:
    loop_var: _tasks
  when: >
    k3s_extra_tasks is defined and
    'applications' in _k3s_phases
