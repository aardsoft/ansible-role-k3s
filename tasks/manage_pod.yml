# Manages a single k3s-pod definition from network_nodes/network_pods.
# Called with _pod as loop variable: {key: pod_name, value: pod_definition}

- name: "set pod facts ({{_pod.key}})"
  set_fact:
    _pod_name: "{{_pod.key}}"
    _pod_namespace: "{{(_pod.value.k3s|default({})).namespace|default(_pod.key)}}"
    _pod_containers: "{{(_pod.value.pod|default({})).containers|default({})}}"
    _pod_networks: "{{_pod.value.networks|default({})}}"
    _pod_labels: "{{((_pod.value.k3s|default({})).labels|default({})) | combine(_pod.value.k3s|default({}) | k3s_np_labels)}}"
    _pod_volumes: "{{(_pod.value.pod|default({})).volumes|default([])}}"
    _pod_workload_type: "{{(_pod.value.k3s|default({})).workload_type|default('Deployment')}}"
    _pod_workload_strategy: "{{(_pod.value.k3s|default({})).workload_strategy|default('RollingUpdate')}}"
    _pod_tolerations: "{{(_pod.value.pod|default({})).tolerations|default([])}}"
    _pod_node_selector: "{{(_pod.value.k3s|default({})).node_selector|default({})}}"
    _pod_configmaps: "{{(_pod.value.pod|default({})).configmaps|default([])}}"
    _pod_secrets: "{{(_pod.value.pod|default({})).secrets|default([])}}"
    _pod_init_containers: "{{(_pod.value.pod|default({})).initContainers|default([])}}"
    _pod_manifest: "{{(_pod.value.pod|default({})).manifest|default(false)}}"
    _pod_selector: "{{(_pod.value.k3s|default({})).selector|default({'app': _pod.key})}}"
    _pod_extra_templates: "{{(_pod.value.pod|default({})).extra_manifest_templates|default([])}}"

- name: "get current namespace ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
    name: "{{_pod_namespace}}"
  register: _current_pod_namespace
  when: _pod_namespace != 'default'

- name: "create namespace ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_desired}}"
  vars:
    _desired:
      apiVersion: v1
      kind: Namespace
      metadata:
        name: "{{_pod_namespace}}"
        labels:
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
  when: >
    _pod_namespace != 'default' and
    _desired | k3s_content_changed((_current_pod_namespace.resources | default([]))[0] | default(none))

- name: "set snippet role paths from pod data ({{_pod_name}})"
  set_fact:
    _snippet_role_paths: "{{_pod.value._snippet_role_paths | default({})}}"

- name: "DEBUG snippet role paths ({{_pod_name}})"
  debug:
    msg:
      - "pod_name: {{ _pod_name }}"
      - "snippets: {{ (_pod.value.k3s | default({})).snippets | default([]) }}"
      - "_snippet_role_paths: {{ _snippet_role_paths }}"
      - "_pod.value._snippet_role_paths: {{ _pod.value._snippet_role_paths | default('UNDEFINED') }}"

# Promote pod host_vars into the local variable scope so snippet roles
# (e.g. cms-grav/deploy_container.yml) can access passdb paths, git repo
# URLs, and other per-pod variables without reaching into hostvars.
- name: "set pod host vars as facts ({{_pod_name}})"
  set_fact:
    "{{ item.key }}": "{{ item.value }}"
  with_dict: "{{ _pod.value.host_vars | default({}) }}"

# Snippet roles may provide additional tasks (e.g. Secret creation, pre-deploy
# checks) beyond the pod definition itself.  Include each snippet role's
# deploy_container.yml if it exists, silently skipping roles that don't.
- name: "include snippet role tasks ({{_pod_name}})"
  include_role:
    name: "{{_snippet_role}}"
    tasks_from: deploy_container
  loop: "{{(_pod.value.k3s|default({})).snippets|default([])}}"
  loop_control:
    loop_var: _snippet_role
  when: >
    _snippet_role_paths is defined and
    _snippet_role_paths[_snippet_role] is defined and
    (_snippet_role_paths[_snippet_role] ~ '/tasks/deploy_container.yml') is file

# Pre-fetch all existing ConfigMaps for this pod once.  Used for both
# content-change comparison below (to avoid spurious pod restarts from
# volatile annotation diffs) and for stale cleanup at the end of this file.
- name: "query existing ConfigMaps for this pod ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: ConfigMap
    namespace: "{{_pod_namespace}}"
    label_selectors:
      - "app={{_pod_name}}"
      - "configurator=ansible"
  register: _existing_pod_configmaps

- name: "index existing ConfigMaps by name ({{_pod_name}})"
  set_fact:
    _existing_cm_index: >-
      {{ dict(_existing_pod_configmaps.resources
              | map(attribute='metadata.name')
              | zip(_existing_pod_configmaps.resources)) }}

- name: "create ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-configmap.yml.j2')}}"
  register: _data_cm_results
  loop: "{{_pod_configmaps | rejectattr('authorized_keys', 'defined') | rejectattr('file', 'defined') | rejectattr('template', 'defined') | rejectattr('passdb', 'defined') | rejectattr('dir', 'defined') | list}}"
  loop_control:
    loop_var: _configmap
    label: "{{_configmap.name}}"
  vars:
    _current_cm: "{{ _existing_cm_index[_configmap.name] if _configmap.name in _existing_cm_index else none }}"
  when: lookup('template', 'pod-configmap.yml.j2') | from_yaml | k3s_content_changed(_current_cm)

- name: "create authorized_keys ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{_ak_cm.name}}"
        namespace: "{{_pod_namespace}}"
        labels:
          app: "{{_pod_name}}"
          configurator: ansible
        annotations:
          ansible.run-id: "{{ansible_run_id|default('N/A')}}"
          ansible.config_file: "{{ansible_config_file|default('N/A')}}"
          ansible.version: "{{ansible_version.full}}"
      data:
        authorized_keys: "{{lookup('template', 'pod-authorized-keys.j2')}}"
  register: _ak_cm_results
  loop: "{{_pod_configmaps | selectattr('authorized_keys', 'defined') | list}}"
  loop_control:
    loop_var: _ak_cm
    label: "{{_ak_cm.name}}"
  vars:
    _ak_use_management: "{{_ak_cm.authorized_keys.management | default(false)}}"
    _ak_key_names: "{{_ak_cm.authorized_keys.key_names | default([])}}"
    _current_cm: "{{ _existing_cm_index[_ak_cm.name] if _ak_cm.name in _existing_cm_index else none }}"
  when: >-
    {'apiVersion': 'v1', 'kind': 'ConfigMap',
     'metadata': {'name': _ak_cm.name, 'namespace': _pod_namespace,
                  'labels': {'app': _pod_name, 'configurator': 'ansible'}},
     'data': {'authorized_keys': lookup('template', 'pod-authorized-keys.j2')}}
    | k3s_content_changed(_current_cm)

- name: "create file-backed ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-configmap-file.yml.j2')}}"
  register: _file_cm_results
  loop: "{{_pod_configmaps | selectattr('file', 'defined') | list}}"
  loop_control:
    loop_var: _file_cm
    label: "{{_file_cm.name}}"
  vars:
    _current_cm: "{{ _existing_cm_index[_file_cm.name] if _file_cm.name in _existing_cm_index else none }}"
  when: lookup('template', 'pod-configmap-file.yml.j2') | from_yaml | k3s_content_changed(_current_cm)

- name: "pre-render template-backed ConfigMaps for pod ({{_pod_name}})"
  ansible.builtin.set_fact:
    _pod_template_cm_index: >-
      {{ (_pod_template_cm_index | default({}))
         | combine({_template_cm.name: lookup('template', 'pod-configmap-template.yml.j2') | from_yaml}) }}
  loop: "{{_pod_configmaps | selectattr('template', 'defined') | list}}"
  loop_control:
    loop_var: _template_cm
    label: "{{_template_cm.name}}"
  register: _pod_template_cm_prerender
  ignore_errors: true
  changed_when: false

- name: "fail if ConfigMap template render failed ({{_pod_name}})"
  ansible.builtin.fail:
    msg: |
      ConfigMap template render failed for pod '{{_pod_name}}'.

      The template file (or a template it includes) references a missing
      passdb entry, undefined variable, or has a Jinja2 syntax error.

      Common cause: a passdb path used in a pod template does not exist.
      Create the entry, fix the variable, or review the template file.
  when: _pod_template_cm_prerender is failed

- name: "create template-backed ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_pod_template_cm_index[_template_cm.name]}}"
  register: _template_cm_results
  loop: "{{_pod_configmaps | selectattr('template', 'defined') | list}}"
  loop_control:
    loop_var: _template_cm
    label: "{{_template_cm.name}}"
  vars:
    _current_cm: "{{ _existing_cm_index[_template_cm.name] if _template_cm.name in _existing_cm_index else none }}"
  when: >
    _pod_template_cm_index is defined and
    _template_cm.name in _pod_template_cm_index and
    _pod_template_cm_index[_template_cm.name] | k3s_content_changed(_current_cm)

- name: "create passdb ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-configmap-passdb.yml.j2')}}"
  register: _passdb_cm_results
  loop: "{{_pod_configmaps | selectattr('passdb', 'defined') | list}}"
  loop_control:
    loop_var: _passdb_cm
    label: "{{_passdb_cm.name}}"
  vars:
    _current_cm: "{{ _existing_cm_index[_passdb_cm.name] if _passdb_cm.name in _existing_cm_index else none }}"
  when: lookup('template', 'pod-configmap-passdb.yml.j2') | from_yaml | k3s_content_changed(_current_cm)

- name: "create directory-backed ConfigMaps for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-configmap-dir.yml.j2')}}"
  register: _dir_cm_results
  loop: "{{_pod_configmaps | selectattr('dir', 'defined') | list}}"
  loop_control:
    loop_var: _dir_cm
    label: "{{_dir_cm.name}}"
  vars:
    _current_cm: "{{ _existing_cm_index[_dir_cm.name] if _dir_cm.name in _existing_cm_index else none }}"
  when: lookup('template', 'pod-configmap-dir.yml.j2') | from_yaml | k3s_content_changed(_current_cm)

- name: "generate Secrets for pod ({{_pod_name}})"
  include_tasks: generate_ssh_host_key_secret.yml
  loop: "{{_pod_secrets | selectattr('generate', 'defined') | list}}"
  loop_control:
    loop_var: _gen_secret
    label: "{{_gen_secret.name}}"

- name: "query existing PVCs for this pod ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: PersistentVolumeClaim
    namespace: "{{_pod_namespace}}"
    label_selectors:
      - "app={{_pod_name}}"
      - "configurator=ansible"
  register: _existing_pod_pvcs

- name: "index existing PVCs by name ({{_pod_name}})"
  set_fact:
    _existing_pvc_index: >-
      {{ dict(_existing_pod_pvcs.resources
              | map(attribute='metadata.name')
              | zip(_existing_pod_pvcs.resources)) }}

- name: "create PersistentVolumeClaims for pod volumes ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-pvc.yml.j2')}}"
  loop: "{{_pod_volumes}}"
  loop_control:
    loop_var: _pvc
    label: "{{_pvc.name}}"
  vars:
    _pvc_name: "{{_pvc.persistentVolumeClaim.claimName}}"
    _current_pvc: "{{ _existing_pvc_index[_pvc_name] if _pvc_name in _existing_pvc_index else none }}"
  when: >
    _pvc.persistentVolumeClaim is defined and
    (lookup('template', 'pod-pvc.yml.j2') | from_yaml | k3s_content_changed(_current_pvc))

- name: "push workload template for debug ({{_pod_name}})"
  become: false
  connection: local
  local_action:
    module: ansible.builtin.template
    mode: 0600
    src: pod-deployment.yml.j2
    dest: "{{_k3s_debug_path}}/{{_pod_name}}-{{_pod_workload_type | lower}}.yaml"
  changed_when: false
  when: _k3s_debug_path is defined and not _pod_manifest

- name: "push raw manifest for debug ({{_pod_name}})"
  become: false
  connection: local
  copy:
    mode: 0600
    content: "{{_pod_manifest | to_nice_yaml}}"
    dest: "{{_k3s_debug_path}}/{{_pod_name}}-manifest.yaml"
  changed_when: false
  when: _k3s_debug_path is defined and _pod_manifest

- name: "get current workload ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: apps/v1
    kind: "{{_pod_workload_type}}"
    name: "{{_pod_name}}"
    namespace: "{{_pod_namespace}}"
  register: _current_pod_workload
  when: not _pod_manifest and _pod_containers | length > 0

- name: "deploy workload from template ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-deployment.yml.j2')}}"
  when: >
    not _pod_manifest and _pod_containers | length > 0 and
    (lookup('template', 'pod-deployment.yml.j2') | from_yaml
     | k3s_content_changed((_current_pod_workload.resources | default([]))[0] | default(none)))

- name: "apply raw workload manifest ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_pod_manifest}}"
  when: _pod_manifest

- name: "apply extra manifests for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{_extra_item | from_yaml if _extra_item is string else _extra_item}}"
  loop: "{{(_pod.value.pod|default({})).extra_manifests|default([])}}"
  loop_control:
    loop_var: _extra_item
    label: "{{(_extra_item | from_yaml if _extra_item is string else _extra_item).metadata.name | default('unnamed')}}"

# Render extra_manifest_templates from Jinja2 templates in
# templates/extra-manifests/<name>.j2 and apply the resulting manifests.
- name: "render extra manifest templates for pod ({{_pod_name}})"
  set_fact:
    _extra_template_results: "{{ _extra_template_results | default([]) + [_rendered] }}"
  vars:
    _template_cfg: "{{ _tmpl_item }}"
    _rendered: "{{ lookup('template', 'extra-manifests/' + _tmpl_item.name + '.j2') | from_yaml }}"
  loop: "{{ _pod_extra_templates }}"
  loop_control:
    loop_var: _tmpl_item
    label: "{{ _tmpl_item.name }}"

- name: "push extra manifest templates for debug ({{_pod_name}})"
  become: false
  connection: local
  local_action:
    module: ansible.builtin.copy
    mode: 0600
    content: "{{ _extra_template_results | to_nice_yaml }}"
    dest: "{{_k3s_debug_path}}/{{_pod_name}}-extra-templates.yaml"
  changed_when: false
  when: _k3s_debug_path is defined and _extra_template_results | default([]) | length > 0

- name: "apply extra manifest templates for pod ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    server_side_apply:
      field_manager: ansible
      force_conflicts: true
    definition: "{{_tmpl_result}}"
  loop: "{{ _extra_template_results | default([]) }}"
  loop_control:
    loop_var: _tmpl_result
    label: "{{_tmpl_result.metadata.name | default('unnamed')}}"

# Clean up stale extra manifests (NetworkPolicies, etc.) that were previously
# applied but are no longer defined in the pod config.
- name: "query existing ansible-managed NetworkPolicies for this pod ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: NetworkPolicy
    namespace: "{{_pod_namespace}}"
    label_selectors:
      - "app={{_pod_name}}"
      - "configurator=ansible"
  register: _existing_pod_nps

- name: "build expected NetworkPolicy names from extra manifests ({{_pod_name}})"
  set_fact:
    _expected_np_names: >-
      {{ (_pod.value.pod|default({})).extra_manifests|default([])
         | map('from_yaml')
         | selectattr('kind', 'equalto', 'NetworkPolicy')
         | map(attribute='metadata.name')
         | list }}

- name: "remove stale NetworkPolicies ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "{{_np_item.metadata.name}}"
        namespace: "{{_pod_namespace}}"
  loop: "{{_existing_pod_nps.resources}}"
  loop_control:
    loop_var: _np_item
    label: "{{_np_item.metadata.name}}"
  when: _np_item.metadata.name not in _expected_np_names

- name: "warn if no containers or manifest defined ({{_pod_name}})"
  debug:
    msg: "WARNING: pod {{_pod_name}} has neither pod.containers nor pod.manifest defined, skipping workload deployment"
  when: not _pod_manifest and _pod_containers | length == 0

# ConfigMaps mounted via subPath are not updated automatically in running pods.
# Patch the workload with a restart timestamp to trigger a rolling update whenever
# any such ConfigMap content changes (authorized_keys or inline data configmaps).
- name: "rollout restart workload if subPath-mounted ConfigMap changed ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: patched
    kind: "{{_pod_workload_type}}"
    name: "{{_pod_name}}"
    namespace: "{{_pod_namespace}}"
    definition:
      spec:
        template:
          metadata:
            annotations:
              kubectl.kubernetes.io/restartedAt: "{{ansible_date_time.iso8601}}"
  when:
    - not _pod_manifest
    - _pod_containers | length > 0
    - (_ak_cm_results.changed | default(false)) or (_data_cm_results.changed | default(false)) or (_file_cm_results.changed | default(false)) or (_template_cm_results.changed | default(false)) or (_passdb_cm_results.changed | default(false)) or (_dir_cm_results.changed | default(false))

# Clean up PVCs for volumes that were removed from config. This runs after the
# Deployment update so the rolling update has already removed the volumeMount
# from the pod spec.  The pvc-protection finalizer ensures K8s won't actually
# delete a PVC until all pods have released it, so there is no data-loss race.
- name: "build expected PVC names from current volume config ({{_pod_name}})"
  set_fact:
    _expected_pvc_names: >-
      {{ _pod_volumes
         | selectattr('persistentVolumeClaim', 'defined')
         | map(attribute='persistentVolumeClaim.claimName')
         | list }}

- name: "remove stale PersistentVolumeClaims ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: v1
      kind: PersistentVolumeClaim
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{_pod_namespace}}"
  loop: "{{_existing_pod_pvcs.resources}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: item.metadata.name not in _expected_pvc_names

- name: "build expected ConfigMap names from current config ({{_pod_name}})"
  set_fact:
    _expected_configmap_names: >-
      {{ _pod_configmaps | map(attribute='name') | list }}

- name: "remove stale ConfigMaps ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{_pod_namespace}}"
  loop: "{{_existing_pod_configmaps.resources}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: item.metadata.name not in _expected_configmap_names

- name: "query ansible-managed Secrets for this pod ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Secret
    namespace: "{{_pod_namespace}}"
    label_selectors:
      - "app={{_pod_name}}"
      - "configurator=ansible"
  register: _existing_pod_secrets

- name: "build expected Secret names from current config ({{_pod_name}})"
  set_fact:
    _expected_secret_names: >-
      {{ _pod_secrets | map(attribute='name') | list }}

- name: "remove stale Secrets ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{_pod_namespace}}"
  loop: "{{_existing_pod_secrets.resources}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: item.metadata.name not in _expected_secret_names

# Query existing services before create/update to handle stale removal and
# format migrations (e.g. deprecated metallb annotations) in a single pass.
# Services are deleted unconditionally if stale, or if they carry a deprecated
# annotation that would conflict with the current spec format.
- name: "query existing ansible-managed services for this pod ({{_pod_name}})"
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Service
    namespace: "{{_pod_namespace}}"
    label_selectors:
      - "app={{_pod_name}}"
      - "configurator=ansible"
  register: _existing_pod_services

- name: "index existing services by name ({{_pod_name}})"
  set_fact:
    _existing_svc_index: >-
      {{ dict(_existing_pod_services.resources
              | map(attribute='metadata.name')
              | zip(_existing_pod_services.resources)) }}

- name: "build expected service names from current network config ({{_pod_name}})"
  set_fact:
    _expected_service_names: >-
      {{ _pod_networks | dict2items
         | selectattr('value.ports', 'defined')
         | map(attribute='key')
         | map('regex_replace', '^', _pod_name ~ '-')
         | list +
         _pod_networks | dict2items
         | selectattr('value.links', 'defined')
         | map(attribute='key')
         | map('regex_replace', '^', _pod_name ~ '-')
         | list +
         _pod_networks | dict2items
         | selectattr('value.link', 'defined')
         | selectattr('value.link', 'in', _pod_containers)
         | map(attribute='key')
         | map('regex_replace', '^', _pod_name ~ '-')
         | list
         | unique }}

# Delete services that are stale (removed from config) or that use the
# deprecated spec.loadBalancerIP field instead of the metallb annotation.
# Requires a clean slate when migrating from loadBalancerIP.
- name: "remove stale or format-migrating LoadBalancer services ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: v1
      kind: Service
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{_pod_namespace}}"
  loop: "{{_existing_pod_services.resources}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: >
    item.metadata.name not in _expected_service_names or
    ((item.spec.type | default('')) == 'LoadBalancer' and
     'metallb.universe.tf/loadBalancerIPs' not in (item.metadata.annotations | default({})))

# Create services for each network interface that has ports configured.
# Service type is LoadBalancer when addresses are present (metallb-backed),
# otherwise ClusterIP for internal-only exposure (e.g. via Ingress/Traefik).
# Port sources in order of precedence:
#   ports:  explicit list on the interface itself (use with pod.manifest)
#   links:  list of container names; ports collected from each (simple mode)
#   link:   single container name; ports collected from it (simple mode)
- name: "deploy service for network interface ({{_pod_name}})"
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'pod-service.yml.j2')}}"
  vars:
    _svc_name: "{{_pod_name}}-{{_network_iface.key}}"
    _current_svc: "{{ _existing_svc_index[_svc_name] if _svc_name in _existing_svc_index else none }}"
  with_dict: "{{_pod_networks}}"
  loop_control:
    loop_var: _network_iface
  when: >
    (_network_iface.value.ports is defined or
     (_network_iface.value.link is defined and
      _network_iface.value.link in _pod_containers and
      (_pod_containers[_network_iface.value.link].ports | default([])) | length > 0) or
     (_network_iface.value.links is defined and
      _network_iface.value.links | length > 0)) and
    (lookup('template', 'pod-service.yml.j2') | from_yaml | k3s_content_changed(_current_svc))

- name: "note interfaces without port configuration ({{_pod_name}})"
  debug:
    msg: "Interface {{_network_iface.key}} on pod {{_pod_name}} has no port configuration in container {{_network_iface.value.link|default('(no link)')}}, skipping service"
  with_dict: "{{_pod_networks}}"
  loop_control:
    loop_var: _network_iface
  when: >
    _network_iface.value.ports is undefined and
    _network_iface.value.links is undefined and
    ((_network_iface.value.link is undefined) or
     (_network_iface.value.link not in _pod_containers) or
     ((_pod_containers[_network_iface.value.link].ports | default([])) | length == 0))
