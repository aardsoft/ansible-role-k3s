# Deploy cert-manager webhook for tinydns-sidecar DNS-01 challenge.
#
# Expects _k3s_cfg.cert_manager.tinydns_webhook to be defined with:
#   private_key_passdb: passdb path to Ed25519 private key (PEM)
#   image:            webhook container image (optional)
#   image_pull_policy: image pull policy (optional)
#
# The corresponding public key must already be present in the tinydns-sidecar
# config under the key ID referenced in the Issuer webhook config.

- name: lookup tinydns webhook private key from passdb
  set_fact:
    _webhook_private_key: "{{ lookup(k3s_passdb, _k3s_cfg.cert_manager.tinydns_webhook.private_key_passdb, returnall=true) }}"
  when: >
    _k3s_cfg.cert_manager.tinydns_webhook is defined and
    _k3s_cfg.cert_manager.tinydns_webhook.private_key_passdb is defined

# Query existing namespace-scoped resources for idempotency
- name: query existing webhook namespace resources
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    namespace: "{{_k3s_cfg.cert_manager.namespace|default('cert-manager')}}"
    kind: "{{item}}"
  loop:
    - Deployment
    - Service
    - ServiceAccount
    - Secret
  register: _webhook_existing_ns_resources

- name: query existing webhook resources in kube-system
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    namespace: kube-system
    kind: "{{item}}"
  loop:
    - Role
    - RoleBinding
  register: _webhook_existing_kube_system_resources

- name: index existing webhook namespace resources by kind/name
  set_fact:
    _webhook_ns_index: >-
      {{ ((_webhook_existing_ns_resources.results | default([]) | map(attribute='resources') | flatten)
          + (_webhook_existing_kube_system_resources.results | default([]) | map(attribute='resources') | flatten))
         | k3s_resource_index }}

# Query cluster-scoped resources
- name: query existing webhook cluster resources
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: "{{item}}"
  loop:
    - ClusterRole
    - ClusterRoleBinding
    - APIService
  register: _webhook_existing_cluster_resources

- name: index existing webhook cluster resources by kind/name
  set_fact:
    _webhook_cluster_index: >-
      {{ (_webhook_existing_cluster_resources.results | default([]) | map(attribute='resources') | flatten)
         | k3s_resource_index }}

- name: create webhook private key Secret
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{lookup('template', 'cert-manager-webhook-secret.yaml.j2') | from_yaml}}"
  when:
    - _webhook_private_key is defined
    - lookup('template', 'cert-manager-webhook-secret.yaml.j2') | from_yaml
      | k3s_content_changed(
          _webhook_ns_index['Secret/cert-manager-webhook-tinydns'] | default(none))

- name: apply webhook RBAC
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{item}}"
  loop: "{{lookup('template', 'cert-manager-webhook-rbac.yaml.j2') | from_yaml_all | list}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: >
    item | k3s_content_changed(
      (_webhook_ns_index[item.kind ~ '/' ~ item.metadata.name] | default(none))
      if item.metadata.namespace is defined
      else _webhook_cluster_index[item.kind ~ '/' ~ item.metadata.name] | default(none))

- name: apply webhook Deployment and Service
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{item}}"
  loop: "{{lookup('template', 'cert-manager-webhook-deployment.yaml.j2') | from_yaml_all | list}}"
  loop_control:
    label: "{{item.metadata.name}}"
  when: >
    item | k3s_content_changed(
      _webhook_ns_index[item.kind ~ '/' ~ item.metadata.name] | default(none))

- name: apply webhook APIService
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_webhook_apiservice}}"
  vars:
    _webhook_apiservice: "{{lookup('template', 'cert-manager-webhook-apiservice.yaml.j2') | from_yaml}}"
  when: >
    _webhook_apiservice | k3s_content_changed(
      _webhook_cluster_index['APIService/' ~ _webhook_apiservice.metadata.name] | default(none))
