# Deploy network policies to system namespaces (kube-system, cert-manager, etc.)
# These namespaces host core infrastructure and need baseline policies that
# allow ingress from the node network so API server webhooks and kubelet
# probes work.  This task runs in deploy_infrastructure.yml (phase split,
# formerly deploy_on_first.yml) before any Helm charts deploy into system
# namespaces.

- name: check for colliding policy names (dmz / access_areas / service_vlans)
  # runs first, on the system-deploy file, to fail the run before ANY
  # policy — infrastructure or application — is applied from a colliding
  # config; see the identical check in deploy_network_policies.yml for the
  # full rationale (same-name sections render the same (namespace, name)
  # and churn forever).
  ansible.builtin.assert:
    that: (_np_name_collisions | length) == 0
    fail_msg: >-
      Network policy name collision: {{ _np_name_collisions | join(', ') }}
      is used by more than one of dmz_cidrs / access_areas / service_vlans
      (or clashes with a built-in name) — both sections would generate the
      same policy objects and overwrite each other on every run.  Rename one
      of the entries (pod labels using the shared name must follow, e.g.
      network/<new-name>: "true" instead of network/<old-name>: "true").
  vars:
    _np_name_collisions: "{{ _k3s_cfg.network_policies | k3s_np_name_collisions }}"

- name: check for unresolvable traefik access areas (metallb pools)
  # Duplicated from deploy_network_policies.yml like the collision assert
  # above: this file runs in the infrastructure phase, and the hazard
  # guards against manifests then — inert traefik labels in kube-system
  # blackhole the LB pools long before the applications-phase copy would
  # ever fire.  Fail before ANY policy is applied.  See the
  # applications-phase copy for the full rationale; note the filter counts
  # only CIDR-defined areas as resolvable (see its docstring) because
  # namespace-defined zones never render an ingress policy in kube-system.
  ansible.builtin.assert:
    that: (_np_unmatched_areas | length) == 0
    fail_msg: >-
      MetalLB pool access_area names no network policy section:
      {{ _np_unmatched_areas | join(', ') }}.  The traefik pod label
      network/<area> would be rendered but no allow-<area>-ingress policy
      exists in kube-system to match it, so LB traffic to that pool would
      be blackholed by the default-deny namespace baseline.  Fix: add a
      cidr-defined access_areas (or service_vlans) entry with that name,
      set dmz_cidrs if the pool is DMZ-facing, or correct the pool's
      access_area value.
  vars:
    _np_unmatched_areas: "{{ _k3s_cfg | k3s_np_unmatched_areas }}"

- name: query existing namespaces
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
  register: _np_all_namespaces

- name: compute existing system namespaces
  set_fact:
    _np_existing_system_ns: "{{ _np_all_namespaces.resources | map(attribute='metadata.name') | list | intersect(_k3s_cfg.network_policies.system_namespaces | default([])) }}"

- name: skip system policies when no namespaces exist yet
  debug:
    msg: "No system namespaces exist yet, skipping system network policy deployment"
  when: _np_existing_system_ns | length == 0

- name: query ansible-managed policies in system namespaces
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    api_version: networking.k8s.io/v1
    kind: NetworkPolicy
    namespace: "{{_ns}}"
    label_selectors:
      # DUAL selector — role-ownership invariant: k3s-role templates label
      # their NetworkPolicies with BOTH configurator=ansible and
      # app.kubernetes.io/managed-by=k3s; k3s-deployments policies carry
      # managed-by=k3s-deployments (no configurator label on their
      # NetworkPolicies), so they are not matched by this cleanup.
      - "configurator=ansible"
      - "app.kubernetes.io/managed-by=k3s"
  loop: "{{_np_existing_system_ns}}"
  loop_control:
    loop_var: _ns
  register: _np_sys_queries
  when: _np_existing_system_ns | length > 0

- name: index ansible-managed system policies by namespace/name
  set_fact:
    _np_sys_existing: >-
      {{ _np_sys_queries.results | map(attribute='resources') | flatten
         | k3s_ns_resource_index }}
  when: _np_existing_system_ns | length > 0

- name: build desired system namespace policies
  set_fact:
    _np_sys_desired: "{{ lookup('template', 'network-policies-system.yaml.j2') | from_yaml_all | select('mapping') | list }}"
  vars:
    _np_namespaces: "{{_np_existing_system_ns}}"
    _np_cfg: "{{_k3s_cfg.network_policies}}"
    _k3s_cluster_cidr: "{{_k3s_cfg.cluster_cidr | default('')}}"
  when: _np_existing_system_ns | length > 0

- name: deploy system namespace network policies
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: present
    apply: yes
    definition: "{{_np_resource}}"
  loop: "{{_np_sys_desired | default([])}}"
  loop_control:
    loop_var: _np_resource
  when: >
    _np_existing_system_ns | length > 0 and
    _np_resource | k3s_content_changed(
      _np_sys_existing[_np_resource.metadata.namespace ~ '/' ~ _np_resource.metadata.name] | default(none))

- name: remove stale ansible-managed policies from system namespaces
  kubernetes.core.k8s:
    kubeconfig: "{{_k3s_kubecfg}}"
    state: absent
    definition:
      apiVersion: networking.k8s.io/v1
      kind: NetworkPolicy
      metadata:
        name: "{{item.metadata.name}}"
        namespace: "{{item.metadata.namespace}}"
  loop: "{{_np_sys_queries.results | default([]) | map(attribute='resources') | flatten
            | rejectattr('metadata.name', 'in', _k3s_cfg.network_policies | k3s_np_expected_names_system)
            | list}}"
  loop_control:
    label: "{{item.metadata.namespace}}/{{item.metadata.name}}"
  when: _np_existing_system_ns | length > 0
