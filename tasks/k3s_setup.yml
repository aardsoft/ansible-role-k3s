- name: check k3s service state
  ansible.builtin.systemd_service:
    name: k3s
  register: _k3s_status

- set_fact:
    _k3s_token: ""
    _k3s_token_passdb: ""
    _k3s_bind_args: ""
    _k3s_flannel_iface: ""
    _node_uninitialized: false

- set_fact:
    _k3s_token_passdb: "{{lookup(k3s_passdb, _k3s_cfg.node_token_passdb, missing='empty')}}"
  when: _k3s_cfg.node_token_passdb is defined

- set_fact:
    _k3s_installer: "{{local_bin|default('/usr/local/bin')}}/k3s_installer.sh"
    _k3s_binary_dest: "{{local_bin|default('/usr/local/bin')}}/k3s"

- name: pull node token
  slurp:
    src: "/var/lib/rancher/k3s/server/node-token"
  register: _k3s_token_slurp
  changed_when: false
  ignore_errors: true
  no_log: true

- set_fact:
    _node_uninitialized: true
  when: >
    _k3s_token_slurp.failed == true and
    k3s_role|default('agent') == 'server'

- ansible.builtin.service_facts:
  when: k3s_role|default('agent') == 'agent'

- set_fact:
    _node_uninitialized: true
  when: >
    k3s_role|default('agent') == 'agent' and
    ansible_facts['services']['k3s-agent.service']['status'] | default('not-found') != 'enabled'

# When a specific k3s version is pinned (air-gapped / reproducible installs),
# download the binary from the configured URL so the installer can use it
# without reaching the internet.  The installer itself still runs and handles
# systemd unit creation, SELinux policies, etc.
- name: download pinned k3s binary
  ansible.builtin.get_url:
    url: "{{ _k3s_cfg.binary_url }}"
    dest: "{{ _k3s_binary_dest }}"
    mode: '0755'
    owner: root
  when: >
    _k3s_cfg.binary_url is defined and
    (_node_uninitialized | default(false) or
     k3s_upgrade | default(false) | bool)

- name: rotate journals before install
  ansible.builtin.command: journalctl --rotate
  changed_when: false
  when: _k3s_cfg.vacuum_logs | default(false) and _node_uninitialized

- name: vacuum journals before install
  ansible.builtin.command: journalctl --vacuum-time=1s
  changed_when: false
  when: _k3s_cfg.vacuum_logs | default(false) and _node_uninitialized

- name: copy k3s installer
  ansible.builtin.copy:
    src: k3s_installer.sh
    dest: "{{_k3s_installer}}"
    mode: 0755
    owner: root

- name: copy k3s-nettest script
  ansible.builtin.copy:
    src: k3s-nettest.sh
    dest: "{{local_bin|default('/usr/local/bin')}}/k3s-nettest"
    mode: 0755
    owner: root

- name: create k3s.service.d
  ansible.builtin.file:
    state: directory
    mode: 0755
    owner: root
    path: /etc/systemd/system/k3s.service.d

- name: create /etc/rancher/k3s
  ansible.builtin.file:
    state: directory
    mode: 0700
    owner: root
    path: /etc/rancher/k3s
  when: _k3s_cfg.use_config_file | default(false) or _k3s_cfg.registries is defined

# When using the embedded registry mirror (air-gapped / island clusters),
# ensure the image staging directory exists before k3s starts.  Operators
# must copy image tarballs into this path before running the role.
- name: create k3s agent images staging directory
  ansible.builtin.file:
    state: directory
    mode: 0755
    owner: root
    path: /var/lib/rancher/k3s/agent/images
  when: >
    _k3s_cfg.embedded_registry | default(false) and
    _node_uninitialized | default(false)

- name: check for staged images on first server
  ansible.builtin.find:
    paths: /var/lib/rancher/k3s/agent/images
    patterns:
      - "*.tar"
      - "*.tar.gz"
      - "*.tar.zst"
    file_type: file
  register: _k3s_staged_images
  when: >
    _k3s_cfg.embedded_registry | default(false) and
    _first_server | default(false)

- name: fail if no images staged on first server during initial bootstrap
  ansible.builtin.fail:
    msg: >
      Air-gapped / island bootstrap requires image tarballs in
      /var/lib/rancher/k3s/agent/images/ on the first server before running
      the role.

      Detected: embedded_registry is enabled, this is the first server, and
      no .tar / .tar.gz / .tar.zst files were found in the staging directory.

      Required images include at minimum:
        - k3s core images (coredns, traefik, metrics-server, pause, etc.)
        - component images for state: present items in your cluster config
        - application pod images from your site.yaml

      Collect tarballs on your operator machine, copy them to the first
      server, then re-run this playbook.
  when: >
    _k3s_cfg.embedded_registry | default(false) and
    _first_server | default(false) and
    _k3s_staged_images.files | default([]) | length == 0 and
    (_k3s_status.status.ActiveState | default('inactive')) != 'active'

- name: copy longhorn environment check
  ansible.builtin.copy:
    src: longhorn/environment_check.sh
    dest: "{{local_bin|default('/usr/local/bin')}}/longhorn_environment_check"
    mode: 0755
    owner: root

- name: parse bind CIDRs
  set_fact:
    _bind_cidrs: "{{ _k3s_cfg.bind_cidr.split(',') | map('trim') | list }}"
    _bind_addresses: []
  when: _k3s_cfg.bind_cidr is defined

- name: find IPv4 bind addresses
  set_fact:
    _bind_addresses: "{{ _bind_addresses + (ansible_all_ipv4_addresses | ansible.utils.ipaddr(__cidr) | list)[:1] }}"
  loop_control:
    loop_var: __cidr
  with_items: "{{ _bind_cidrs | default([]) | ansible.utils.ipv4 | list }}"

- name: find IPv6 bind addresses
  set_fact:
    _bind_addresses: "{{ _bind_addresses + (ansible_all_ipv6_addresses | ansible.utils.ipaddr(__cidr) | list)[:1] }}"
  loop_control:
    loop_var: __cidr
  with_items: "{{ _bind_cidrs | default([]) | ansible.utils.ipv6 | list }}"

- name: reorder bind addresses for IPv6 preference
  set_fact:
    _bind_addresses: "{{ (_bind_addresses | ansible.utils.ipv6 | list) + (_bind_addresses | ansible.utils.ipv4 | list) }}"
  when: >
    _bind_addresses is defined and
    _bind_addresses | length > 0 and
    _k3s_cfg.ip_preference | default('ipv4') == 'ipv6'

- name: fail if bind_cidr addresses are not all bound
  ansible.builtin.fail:
    msg: >-
      bind_cidr '{{ _k3s_cfg.bind_cidr }}' not fully bound on {{ inventory_hostname }}:
      found {{ _bind_addresses | length }} address(es) for {{ _bind_cidrs | length }} CIDR(s)
  when: >
    _bind_cidrs is defined and
    _bind_addresses | length != _bind_cidrs | length

