- name: Find first interface matching bind addresses
  ansible.builtin.set_fact:
    _k3s_flannel_iface: "{{ iface_name }}"
  loop: "{{ ansible_interfaces }}"
  loop_control:
    loop_var: iface_name
    label: "{{ iface_name }} (IPs: {{ current_ips | join(', ') }})"
  vars:
    # Use ansible_facts directly as it's more reliable than the 'ansible_xxx' vars
    iface_data: "{{ ansible_facts[iface_name] | default({}) }}"

    # Strictly collect valid IP strings only
    current_ips: >-
      {{
        ([iface_data.ipv4.address] if iface_data.ipv4.address is defined else []) +
        (iface_data.ipv4_secondaries | default([]) | map(attribute='address') | list) +
        (iface_data.ipv6 | default([]) | map(attribute='address') | list)
      }}
  when:
    - not _k3s_flannel_iface
    - _bind_addresses is defined
    # We use 'unique' to clean the list and then check for matches
    - current_ips | intersect(_bind_addresses) | length > 0

- name: Fail if no matching interface was found
  ansible.builtin.fail:
    msg: >-
      Could not find an interface with an IP belonging to {{ _bind_addresses }}.
      Check your _bind_addresses list or host facts.

  when: _k3s_flannel_iface == ""

- name: add flannel interface to bind args
  set_fact:
    _k3s_bind_args: "{{_k3s_bind_args}} --flannel-iface={{_k3s_flannel_iface}}"
  when: _k3s_flannel_iface != ""

- name: add bind address to bind args
  set_fact:
    _k3s_bind_args: " {{_k3s_bind_args}} --node-ip={{_bind_addresses | join(',')}} --bind-address={{_bind_addresses | ipv4 | first | default(_bind_addresses | first)}}"
  when: _bind_addresses is defined and _bind_addresses | length > 0

- name: order service CIDR by IP preference
  set_fact:
    _k3s_service_cidr: >-
      {{ ((s | ansible.utils.ipv6 | list) + (s | ansible.utils.ipv4 | list)) | join(',')
         if _k3s_cfg.ip_preference | default('ipv4') == 'ipv6'
         else ((s | ansible.utils.ipv4 | list) + (s | ansible.utils.ipv6 | list)) | join(',') }}
  vars:
    s: "{{ _k3s_cfg.service_cidr.split(',') | map('trim') | list }}"
  when: _k3s_cfg.service_cidr is defined

- name: order cluster CIDR by IP preference
  set_fact:
    _k3s_cluster_cidr: >-
      {{ ((s | ansible.utils.ipv6 | list) + (s | ansible.utils.ipv4 | list)) | join(',')
         if _k3s_cfg.ip_preference | default('ipv4') == 'ipv6'
         else ((s | ansible.utils.ipv4 | list) + (s | ansible.utils.ipv6 | list)) | join(',') }}
  vars:
    s: "{{ _k3s_cfg.cluster_cidr.split(',') | map('trim') | list }}"
  when: _k3s_cfg.cluster_cidr is defined

- name: add service cidr to bind args
  set_fact:
    _k3s_bind_args: " {{_k3s_bind_args}} --service-cidr={{_k3s_service_cidr}}"
  when: _k3s_service_cidr is defined

- name: add cluster cidr to bind args
  set_fact:
    _k3s_bind_args: " {{_k3s_bind_args}} --cluster-cidr={{_k3s_cluster_cidr}}"
  when: _k3s_cluster_cidr is defined

- set_fact:
    _k3s_args: "{{k3s_role}} {{_k3s_cfg.args|default('')}}"
  when: _k3s_cfg.use_config_file | default(false)

- set_fact:
    _k3s_args: "{{k3s_role}} {{_k3s_bind_args}} {{_k3s_cfg.args|default('')}}"
  when: not (_k3s_cfg.use_config_file | default(false))

- name: add embedded-registry flag to install args
  set_fact:
    _k3s_args: "{{_k3s_args}} --embedded-registry"
  when: _k3s_cfg.embedded_registry | default(false)

- set_fact:
    _k3s_args: "{{_k3s_args}} --cluster-init --write-kubeconfig-mode={{_k3s_cfg.kubeconfig_mode|default('0600')}}"
  when: _first_server == true and not (_k3s_cfg.use_config_file | default(false))

# Build the installer environment variables once so both setup_master.yml
# and setup_additional.yml can reuse them without duplicating logic.
- set_fact:
    _k3s_install_env:
      INSTALL_K3S_EXEC: "{{ _k3s_args }}"
  when: _k3s_install_env is undefined

- set_fact:
    _k3s_install_env: "{{ _k3s_install_env | combine({'INSTALL_K3S_VERSION': _k3s_cfg.version}) }}"
  when: _k3s_cfg.version is defined

- set_fact:
    _k3s_install_env: "{{ _k3s_install_env | combine({'INSTALL_K3S_CHANNEL': _k3s_cfg.channel}) }}"
  when: _k3s_cfg.channel is defined

- set_fact:
    _k3s_install_env: "{{ _k3s_install_env | combine({'INSTALL_K3S_SKIP_DOWNLOAD': 'true'}) }}"
  when: _k3s_cfg.binary_url is defined

- name: init server certs change tracker
  ansible.builtin.set_fact:
    _k3s_server_certs_changed: false

- name: manage server cert files
  include_tasks: manage_server_cert_file.yml
  loop: "{{_k3s_cfg.server_cert_files | default([])}}"
  loop_control:
    loop_var: _scf
    label: "{{_scf.dest}}"
  when: _k3s_cfg.server_cert_files is defined

- name: write k3s config.yaml
  ansible.builtin.template:
    src: k3s-config.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
    owner: root
  register: _k3s_config_status
  when: _k3s_cfg.use_config_file | default(false)

- name: remove k3s service drop-in (config.yaml mode)
  ansible.builtin.file:
    path: /etc/systemd/system/k3s.service.d/10-exec.conf
    state: absent
  when: _k3s_cfg.use_config_file | default(false)

- name: create k3s service drop-in
  ansible.builtin.template:
    src: k3s.conf.j2
    dest: /etc/systemd/system/k3s.service.d/10-exec.conf
    mode: "0644"
    owner: root
  register: _dropin_status
  when: not (_k3s_cfg.use_config_file | default(false))

- name: write k3s registries.yaml
  ansible.builtin.template:
    src: registries.yaml.j2
    dest: /etc/rancher/k3s/registries.yaml
    mode: "0600"
    owner: root
  register: _k3s_registries_written
  when: >
    _k3s_cfg.registries is defined or
    (_k3s_cfg.embedded_registry | default(false))

- name: remove k3s registries.yaml
  ansible.builtin.file:
    path: /etc/rancher/k3s/registries.yaml
    state: absent
  register: _k3s_registries_removed
  when: >
    _k3s_cfg.registries is not defined and
    not (_k3s_cfg.embedded_registry | default(false))

- name: restart k3s
  ansible.builtin.systemd_service:
    name: k3s
    daemon_reload: true
    state: restarted
  register: _k3s_restarted
  when: >
    (_dropin_status is defined and _dropin_status is changed) or
    (_k3s_config_status is defined and _k3s_config_status is changed) or
    (_k3s_registries_written is defined and _k3s_registries_written is changed) or
    (_k3s_registries_removed is defined and _k3s_registries_removed is changed) or
    (_k3s_server_certs_changed | default(false))
  ignore_errors: true

# Wait for k3s to be active again before the playbook moves to the next node
# (serial: 1 in k3s.yml).  This prevents etcd quorum loss on 3-node clusters
# when a config change (e.g. kube-apiserver-arg for OIDC) triggers a rolling
# restart of all server nodes.
# Checking the local systemd state avoids any assumptions about which address
# the API server binds to or whether it is reachable from the controller.
- name: wait for k3s service to be active after restart
  ansible.builtin.systemd:
    name: k3s
  register: _k3s_service_state
  until: _k3s_service_state.status.ActiveState == 'active'
  retries: 30
  delay: 10
  when: >
    _k3s_restarted is defined and _k3s_restarted is changed and
    k3s_role|default('agent') == 'server'

- name: setup master
  include_tasks: setup_master.yml
  when: >
    (_k3s_token_slurp.failed == true or k3s_upgrade|default(false)|bool == true) and
    k3s_role|default('agent') == 'server' and
    _first_server == true

- name: set k3s token
  set_fact:
    _k3s_token: "{{_k3s_token_slurp.content|b64decode|trim}}"
  when: >
    _k3s_token_slurp.failed == false and
    k3s_role|default('agent') == 'server' and
    _first_server == true

- name: add node token to password store
  set_fact:
    _dummy: "{{lookup(k3s_passdb, _k3s_cfg.node_token_passdb, create=true, userpass=_k3s_token)}}"
  when: >
    _k3s_cfg.node_token_passdb is defined and
    _k3s_token_passdb == "" and
    _first_server == true

- name: delegate k3s tokens
  include_tasks: delegate_token.yml
  with_items: "{{ansible_play_hosts}}"
  loop_control:
    loop_var: _delegate
  when: >
    _first_server == true

- name: use passdb token
  set_fact:
    _k3s_token: "{{_k3s_token_passdb}}"
  when: >
    _k3s_token == "" and
    _k3s_token_passdb != ""

- name: setup additional node
  include_tasks: setup_additional.yml
  when: >
    _first_server == false and
    (_node_uninitialized == true or k3s_upgrade|default(false)|bool == true) and
    k3s_role is defined and
    _k3s_cfg.first_server is defined and
    _k3s_token != ""
