# if we've come that far we should have a basic cluster running, so dump info
- name: get Cluster information
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Config
  register: cluster_info

- debug:
    msg: "k3s cluster information: {{cluster_info|to_nice_json}}"

- name: Show cluster name
  debug:
    msg: "Cluster name is {{ cluster_info.resources[0].name }}"
  when: cluster_info.resources[0].name is defined

- include_tasks: deploy_longhorn.yml
  when: >
    _k3s_cfg.longhorn is defined and
    _k3s_cfg.longhorn.state is defined and
    _k3s_cfg.longhorn.state == 'present'

- include_tasks: heal_longhorn_volumes.yml
  when: >
    _k3s_cfg.longhorn is defined and
    _k3s_cfg.longhorn.state is defined and
    _k3s_cfg.longhorn.state == 'present'

- include_tasks: remove_longhorn.yml
  when: >
    _k3s_cfg.longhorn is defined and
    _k3s_cfg.longhorn.state is defined and
    _k3s_cfg.longhorn.state == 'absent'

- include_tasks: deploy_metallb.yml
  when: >
    _k3s_cfg.metallb is defined and
    _k3s_cfg.metallb.state is defined and
    _k3s_cfg.metallb.state == 'present'

- include_tasks: remove_metallb.yml
  when: >
    _k3s_cfg.metallb is defined and
    _k3s_cfg.metallb.state is defined and
    _k3s_cfg.metallb.state == 'absent'

- include_tasks: deploy_kured.yml
  when: >
    _k3s_cfg.kured is defined and
    _k3s_cfg.kured.state is defined and
    _k3s_cfg.kured.state == 'present'

- include_tasks: remove_kured.yml
  when: >
    _k3s_cfg.kured is defined and
    _k3s_cfg.kured.state is defined and
    _k3s_cfg.kured.state == 'absent'

- name: manage k3s server manifests
  include_tasks: manage_server_manifests.yml
  when: _k3s_cfg.server_manifests is defined

- name: manage node labels
  include_tasks: manage_node_labels.yml

- name: apply cluster RBAC resources
  include_tasks: deploy_rbac.yml
  when: >
    _k3s_cfg.rbac_var is defined or
    _k3s_cfg.rbac_files is defined or
    _k3s_cfg.user_namespaces is defined

# kyverno is not part of this core deployment - but a broken kyverno can block
# us from deploying anything going forward, so we check here if kyverno (if it
# exists) is in a good state, and if it isn't, we inform about it, and allow
# an override option.
- name: fix kyverno webhook if blocking
  include_tasks: fix_kyverno_webhook.yml

- name: run extra deployments
  include_tasks: "deployments.yml"
  with_dict: "{{_k3s_cfg.deployments|default({})}}"
  loop_control:
    loop_var: _deployment

- name: manage k3s pods
  include_tasks: manage_pods.yml
  when: network_pods is defined

# Network policies are applied last so pod label updates from manage_pods and
# extra deployments above are already in place when policies take effect.
- include_tasks: deploy_network_policies.yml
  when: >
    _k3s_cfg.network_policies is defined and
    _k3s_cfg.network_policies.state | default('present') == 'present'

- include_tasks: test_network_policies.yml
  when: >
    _k3s_cfg.network_policies is defined and
    _k3s_cfg.network_policies.state | default('present') == 'present' and
    (_k3s_cfg.network_policies.run_tests | default(false) or k3s_run_tests | default(false))

- include_tasks: remove_network_policies.yml
  when: >
    _k3s_cfg.network_policies is defined and
    _k3s_cfg.network_policies.state | default('present') == 'absent'
