# Network policy connectivity tests.
#
# Creates a dedicated test namespace, applies the cluster network policies to
# it, deploys labelled test pods, verifies expected reachability and
# unreachability, then always cleans up the namespace regardless of results.
#
# Test matrix:
#   client-default -> server-clustersvc:8080     expect: reachable  (cluster-service egress)
#   client-default -> server-default:8080        expect: blocked    (default deny)
#   client-default -> internet (1.1.1.1:80)      expect: blocked    (default deny)
#   client-dmz     -> internet (1.1.1.1:80)      expect: reachable  (dmz egress)
#   client-dmz     -> server-clustersvc:8080     expect: reachable  (cluster-service egress)
#   client-dmz     -> server-default:8080        expect: blocked    (default deny)
#   client-api     -> Kubernetes API server :443 expect: reachable  (api-server opt-in egress)
#   client-default -> Kubernetes API server :443 expect: blocked    (API egress is opt-in)
#
# System / infrastructure tests:
#   test pod       -> cluster DNS                 expect: reachable  (internal dns)
#   test pod       -> external DNS                expect: reachable  (upstream dns, guarded)
#   cert-manager   -> Kubernetes API server :443   expect: reachable  (https egress, guarded)
#   cert-manager   -> ACME server :443            expect: reachable  (https egress, guarded)
#   longhorn-system -> longhorn-frontend :80      expect: reachable  (intra-namespace)
#   kube-system    -> app-ns backend :8080        expect: reachable  (traefik's route into managed ns)
#   kube-system    -> Kubernetes API server :443   expect: reachable  (infra pods need API)
#   longhorn-system -> Kubernetes API server :443 expect: reachable  (longhorn-manager needs API)
#   client-api (curl pod, regular ns) -> API :443   expect: reachable  (network/api-server opt-in;
#                                                                      post-DNAT destination node:6443)
#   client-noapi (curl pod, regular ns) -> API :443 expect: blocked    (opt-in only, no blanket egress)
#   (API probes run in curlimages/curl pods — busybox's TLS stack cannot
#    negotiate with kube-apiserver; see the pod-deployment comment below)
#
# Workload-dependent probes (deployed services, external sidecar URLs) and
# cluster-specific reachability checks do NOT belong here — they live in
# tasks/test_workload_reachability.yml, which runs AFTER the applications
# phase (probes for services that may not exist yet would fail here), and
# are configured per cluster as network_policies.reachability_tests.  See
# that file's header for the schema.
#
# Variables:
#   _np_test_namespace            override test namespace name (default: netpol-test)
#   _np_internet_target_ip          IP for internet reachability tests (default: 1.1.1.1)
#   _np_internet_target_port        port for internet reachability tests (default: 80)
#   _np_test_external               run external connectivity tests (default: true)
#   _np_test_acme_endpoint          ACME server to probe (default: acme-v02.api.letsencrypt.org)
#   _np_test_dns_endpoint           DNS name to resolve externally (default: acme-v02.api.letsencrypt.org)

- name: check for unavailable APIServices
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: APIService
  register: _np_apiservices

- name: fail fast if any APIService is unavailable
  fail:
    msg: >-
      Unavailable APIService(s) detected — namespace deletion will hang,
      breaking network policy tests. Fix before re-running:
      {% for svc in _np_apiservices.resources | selectattr('status.conditions', 'defined') | list %}
      {% set cond = (svc.status.conditions | default([]) | selectattr('type', 'equalto', 'Available') | list | first) | default(none) %}
      {% if cond is not none and cond.status | default('') != 'True' %}
      - {{ svc.metadata.name }}: {{ cond.reason | default('unknown') }} ({{ cond.message | default('no message') }})
        Check pod in namespace {{ svc.spec.service.namespace | default('?') }}: kubectl -n {{ svc.spec.service.namespace | default('?') }} get pods
      {% endif %}
      {% endfor %}
  when: >
    _np_apiservices.resources | default([]) | selectattr('status.conditions', 'defined') | list
    | map('extract', ['status', 'conditions']) | map('default', []) | flatten
    | selectattr('type', 'equalto', 'Available') | selectattr('status', 'equalto', 'False') | list | length > 0

- name: check if cert-manager namespace exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
    name: cert-manager
  register: _np_cert_manager_ns

- name: check if longhorn-system namespace exists
  kubernetes.core.k8s_info:
    kubeconfig: "{{_k3s_kubecfg}}"
    kind: Namespace
    name: longhorn-system
  register: _np_longhorn_ns

- name: set namespace existence flags
  set_fact:
    _np_cert_manager_ns_exists: "{{ (_np_cert_manager_ns.resources | default([])) | length > 0 }}"
    _np_longhorn_ns_exists: "{{ (_np_longhorn_ns.resources | default([])) | length > 0 }}"

# The cert-manager->sidecarURL probe has moved to
# tasks/test_workload_reachability.yml (runs after the applications phase,
# collects its own _np_sidecar_targets from the issuer config) — earlier this
# file kept a duplicate collection that was never consumed.

- name: initialise test state
  set_fact:
    _np_test_ns: "{{_np_test_namespace | default('netpol-test')}}"
    _np_inet_ip: "{{_np_internet_target_ip | default('1.1.1.1')}}"
    _np_inet_port: "{{_np_internet_target_port | default('80')}}"
    _np_test_results: []
    _np_test_external: "{{ _k3s_cfg.network_policies.test_external_connectivity | default(true) }}"
    _np_test_acme_endpoint: "{{ _k3s_cfg.network_policies.test_acme_endpoint | default('acme-v02.api.letsencrypt.org') }}"
    _np_test_dns_endpoint: "{{ _k3s_cfg.network_policies.test_dns_endpoint | default('acme-v02.api.letsencrypt.org') }}"

- name: network policy test run
  block:
    - name: create test namespace
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{_np_test_ns}}"
      changed_when: false

    # Re-run policy deployment so the new namespace is included.
    - name: deploy network policies (including test namespace)
      include_tasks: deploy_network_policies.yml
      vars:
        _np_test_mode: true

    # test pod: unlabelled server
    # Server pods use a busybox nc listen loop rather than httpd: httpd is not
    # present in all busybox image builds, whereas nc -l is always available.
    # The loop responds to every connection with a minimal HTTP 200 header so
    # client-side `grep -q HTTP` can confirm reachability.
    - name: deploy server-default pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-server-default
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-server-default
          spec:
            containers:
              - name: server
                image: busybox:1.34.1
                command: ["sh", "-c", "while true; do printf 'HTTP/1.0 200 OK\r\n\r\nOK' | nc -l -p 8080; done"]
      changed_when: false

    - name: deploy server-default Service
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: np-test-server-default
            namespace: "{{_np_test_ns}}"
          spec:
            selector:
              app: np-test-server-default
            ports:
              - port: 8080
                targetPort: 8080
      changed_when: false

    # test pod: cluster-service server
    - name: deploy server-clustersvc pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-server-clustersvc
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-server-clustersvc
              network/cluster-service: "true"
          spec:
            containers:
              - name: server
                image: busybox:1.34.1
                command: ["sh", "-c", "while true; do printf 'HTTP/1.0 200 OK\r\n\r\nOK' | nc -l -p 8080; done"]
      changed_when: false

    - name: deploy server-clustersvc Service
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Service
          metadata:
            name: np-test-server-clustersvc
            namespace: "{{_np_test_ns}}"
          spec:
            selector:
              app: np-test-server-clustersvc
            ports:
              - port: 8080
                targetPort: 8080
      changed_when: false

    # test pod: unlabelled client
    - name: deploy client-default pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-client-default
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-client-default
          spec:
            containers:
              - name: client
                image: busybox:1.34.1
                command: ["sleep", "3600"]
      changed_when: false

    # test pod: DMZ client
    - name: deploy client-dmz pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-client-dmz
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-client-dmz
              network/dmz: "true"
          spec:
            containers:
              - name: client
                image: busybox:1.34.1
                command: ["sleep", "3600"]
      changed_when: false

    # test pod: API-server opt-in client pair
    # Labeled network/api-server: opts into allow-api-server-egress (the
    # ONLY regular workloads with Kubernetes API egress).  The unlabeled
    # twin keeps the same path denied — this pod pair is the regression pair
    # for the opt-in posture (tests 15/16).
    # Both run curlimages/curl: busybox's built-in TLS stack cannot negotiate
    # with kube-apiserver at all (TLS alert 40 handshake failure; the "reset
    # by peer" reports under docker-library/busybox#162 are the same
    # phenomenon), and a TLS-crippled wget makes both API probes vacuous:
    # reachable never succeeds, blocked always "passes".  busybox:1.34.1
    # stays for the nc/DNS probes, where its plain-TCP tools are fine.
    - name: deploy client-api pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-client-api
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-client-api
              network/api-server: "true"
          spec:
            containers:
              - name: client
                image: curlimages/curl:8.5.0
                command: ["sleep", "3600"]
      changed_when: false

    - name: deploy client-noapi pod
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: present
        definition:
          apiVersion: v1
          kind: Pod
          metadata:
            name: np-test-client-noapi
            namespace: "{{_np_test_ns}}"
            labels:
              app: np-test-client-noapi
          spec:
            containers:
              - name: client
                image: curlimages/curl:8.5.0
                command: ["sleep", "3600"]
      changed_when: false

    # wait for all pods
    # Check both pod phase (Running) and container readiness (ready: true).
    # Phase alone is insufficient: a pod cycling through CrashLoopBackOff has
    # phase=Running even while its containers are in Waiting state.
    - name: wait for test pods to be Running and containers ready
      kubernetes.core.k8s_info:
        kubeconfig: "{{_k3s_kubecfg}}"
        kind: Pod
        namespace: "{{_np_test_ns}}"
        label_selectors:
          - app in (np-test-server-default, np-test-server-clustersvc, np-test-client-default, np-test-client-dmz, np-test-client-api, np-test-client-noapi)
      register: _np_test_pods
      until: >
        _np_test_pods.resources | length == 6 and
        _np_test_pods.resources | map(attribute='status.phase') | list | unique == ['Running'] and
        (_np_test_pods.resources |
         map(attribute='status.containerStatuses') |
         reject('equalto', None) | flatten |
         selectattr('ready', 'equalto', true) | list | length) == 6
      retries: 30
      delay: 5

    # no forced resync before the probes, deliberately
    # The test pods were created AFTER the policies were applied, and the
    # controller's pod-event path updates per-pod enforcement a few seconds
    # after a pod becomes Ready; until then an unprogrammed pod is
    # UNFILTERED.  Forcing a controller resync here would kick the very
    # mechanism the suite is meant to observe — a green "blocked" run would
    # prove the kicked controller, not what out-of-band pods get — so every
    # probe whose expectation depends on enforcement being programmed
    # carries its own retry loop (12x5s), matching what production pods
    # experience.
    #
    # All non-API suite pods pin busybox:1.34.1 (pinned tag beats floating);
    # API probe pods run curlimages/curl because a TLS-crippled client makes
    # the API probes meaningless: reachable never succeeds and blocked
    # always "passes" (see the client-api pod comment).

    # Kubernetes API service ClusterIP
    # Tests 9/13/14 probe the API server through its service.  Take the IP
    # from the live kubernetes service instead of hardcoding the first
    # service-cidr address — clusterIPs[0] is the primary family of a
    # dual-stack config.
    - name: get the Kubernetes API service ClusterIP
      kubernetes.core.k8s_info:
        kubeconfig: "{{_k3s_kubecfg}}"
        kind: Service
        namespace: default
        name: kubernetes
      register: _np_api_service

    - name: store the API ClusterIP
      set_fact:
        _np_api_clusterip: "{{_np_api_service.resources[0].spec.clusterIPs[0] |
                              default(_np_api_service.resources[0].spec.clusterIP)}}"
      when: _np_api_service.resources | length > 0

    - name: default the API ClusterIP (service lookup failed)
      set_fact:
        _np_api_clusterip: "{{_k3s_cfg.service_cidr.split(',') | reject('search', ':') | first | ansible.utils.ipaddr('1')}}"
      when: _np_api_service.resources | length == 0

    # connectivity tests
    # Tests use `kubectl exec` via ansible.builtin.command rather than
    # kubernetes.core.k8s_exec: the k8s_exec module tries to parse the OCI
    # runtime error string as an integer exit code and raises ValueError when
    # the exec fails to start (e.g. container in CrashLoopBackOff backoff).
    # kubectl exec propagates the container exit code correctly.
    #
    # Server pods respond to every connection with a minimal HTTP 200 header.
    # Reachable tests use `{ printf ...; sleep 2; } | nc` to keep nc stdin
    # open while the server responds (busybox nc does a full close, not a
    # half-close, when stdin reaches EOF).
    # Blocked tests use a plain `printf | nc` since a refused/rejected
    # connection returns immediately; no sleep needed.
    # Every probe is wrapped in a retries-until loop (12x5s) covering the
    # controller's pod-event lag; the loop's exit code IS the expectation:
    # achieved = rc 0, never achieved after 60s = rc 1.  For blocking probes
    # that flips the shell semantics vs. a plain probe — `until ! <probe>`
    # exits 0 when the path is blocked — so each blocked test's pass
    # condition below is `rc == 0`, deliberately OPPOSITE of the expectation
    # word.  All tests use ignore_errors so every test runs before the
    # summary.

    - name: "test 1/16: default client -> cluster-service server (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-default
          - "--"
          - sh
          - "-c"
          - "n=0; until { printf 'GET / HTTP/1.0\\r\\n\\r\\n'; sleep 2; } | nc -w 5 np-test-server-clustersvc 8080 | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t1
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'default -> cluster-service', 'expect': 'reachable', 'pass': _np_t1.rc == 0, 'rc': _np_t1.rc}]}}"

    - name: "test 2/16: default client -> default server (expect: blocked)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-default
          - "--"
          - sh
          - "-c"
          - "n=0; until ! printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w 3 np-test-server-default 8080 | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t2
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'default -> default server', 'expect': 'blocked', 'pass': _np_t2.rc == 0, 'rc': _np_t2.rc}]}}"

    - name: "test 3/16: default client -> internet (expect: blocked)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-default
          - "--"
          - sh
          - "-c"
          - "n=0; until ! printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w 3 {{_np_inet_ip}} {{_np_inet_port}} | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t3
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'default -> internet', 'expect': 'blocked', 'pass': _np_t3.rc == 0, 'rc': _np_t3.rc}]}}"

    - name: "test 4/16: dmz client -> internet (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-dmz
          - "--"
          - sh
          - "-c"
          - "n=0; until { printf 'GET / HTTP/1.0\\r\\n\\r\\n'; sleep 2; } | nc -w 5 {{_np_inet_ip}} {{_np_inet_port}} | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t4
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'dmz -> internet', 'expect': 'reachable', 'pass': _np_t4.rc == 0, 'rc': _np_t4.rc}]}}"

    - name: "test 5/16: dmz client -> cluster-service server (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-dmz
          - "--"
          - sh
          - "-c"
          - "n=0; until { printf 'GET / HTTP/1.0\\r\\n\\r\\n'; sleep 2; } | nc -w 5 np-test-server-clustersvc 8080 | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t5
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'dmz -> cluster-service', 'expect': 'reachable', 'pass': _np_t5.rc == 0, 'rc': _np_t5.rc}]}}"

    - name: "test 6/16: dmz client -> default server (expect: blocked)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-dmz
          - "--"
          - sh
          - "-c"
          - "n=0; until ! printf 'GET / HTTP/1.0\\r\\n\\r\\n' | nc -w 3 np-test-server-default 8080 | grep -q HTTP; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t6
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'dmz -> default server', 'expect': 'blocked', 'pass': _np_t6.rc == 0, 'rc': _np_t6.rc}]}}"

    # system / infrastructure tests
    # These use temporary busybox pods in real namespaces to verify that
    # infrastructure components can communicate after policies are applied.

    - name: "test 7/16: internal DNS resolution (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - "{{_np_test_ns}}"
          - dns-test-internal
          - --image=busybox:1.36
          - --restart=Never
          - --rm
          - -i
          - --
          - nslookup
          - kubernetes.default.svc.cluster.local
      register: _np_t7
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'internal DNS resolution', 'expect': 'reachable', 'pass': _np_t7.rc == 0, 'rc': _np_t7.rc}]}}"

    - name: "test 8/16: external DNS resolution (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - "{{_np_test_ns}}"
          - dns-test-external
          - --image=busybox:1.36
          - --restart=Never
          - --rm
          - -i
          - --
          - nslookup
          - "{{_np_test_dns_endpoint}}"
      register: _np_t8
      ignore_errors: true
      changed_when: false
      when: _np_test_external | bool

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'external DNS resolution', 'expect': 'reachable', 'pass': (_np_t8.skipped | default(false)) or ((_np_t8.rc | default(-1)) == 0), 'rc': _np_t8.rc | default('skipped')}]}}"

    - name: "test 9/16: API server HTTPS from cert-manager (expect: reachable)"
      # curlimages/curl, not busybox: busybox's TLS stack cannot negotiate
      # with kube-apiserver, so a wget-based API probe is vacuous —
      # reachable never succeeds.  Pass condition as in test 15: retry
      # while http_code is 000; any response (401 included — k3s /healthz
      # requires auth) proves the path through netpol + TLS.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - cert-manager
          - api-test-certmanager
          - --image=curlimages/curl:8.5.0
          - --restart=Never
          - --labels=app.kubernetes.io/name=cert-manager
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "n=0; out=''; until { out=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://{{_np_api_clusterip}}:443/healthz); [ \"$out\" != \"000\" ]; }; do n=$((n+1)); [ $n -ge 12 ] && { echo \"last attempt code: $out\" >&2; exit 1; }; sleep 5; done"
      register: _np_t9
      ignore_errors: true
      changed_when: false
      when: _np_cert_manager_ns_exists | default(false) | bool

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'API server HTTPS from cert-manager', 'expect': 'reachable', 'pass': (_np_t9.skipped | default(false)) or ((_np_t9.rc | default(-1)) == 0), 'rc': _np_t9.rc | default('skipped')}]}}"

    - name: "test 10/16: cert-manager -> ACME server HTTPS (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - cert-manager
          - cm-test-acme
          - --image=busybox:1.36
          - --restart=Never
          - --labels=app.kubernetes.io/name=cert-manager
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "wget -qO- --timeout=5 https://{{_np_test_acme_endpoint}}/ | grep -q '{'"
          # wget probe, not nc: busybox nc in kubectl-run pods gives silent
          # instant rc=1 false negatives, while wget probes stay reliable
      register: _np_t10
      ignore_errors: true
      changed_when: false
      when: _np_test_external | bool and _np_cert_manager_ns_exists | default(false) | bool

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'cert-manager -> ACME HTTPS', 'expect': 'reachable', 'pass': (_np_t10.skipped | default(false)) or ((_np_t10.rc | default(-1)) == 0), 'rc': _np_t10.rc | default('skipped')}]}}"

    - name: "test 11/16: longhorn intra-namespace (expect: reachable)"
      # longhorn-frontend (UI, port 80), NOT longhorn-backend:9500: since
      # Longhorn 1.12 the upstream manifest ships default ingress netpols
      # that let only longhorn's own component pods reach the manager API
      # (longhorn-backend:9500); with them present a generic probe pod
      # (lh-test-internal, no longhorn labels) is REJECTED there and the
      # assert aborts the whole serial run.  The UI has no version that
      # ships a netpol for it, so it is the stable intra-namespace target.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - longhorn-system
          - lh-test-internal
          - --image=busybox:1.36
          - --restart=Never
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "wget -qO- --timeout=5 http://longhorn-frontend 2>/dev/null | head -c 200 | grep -qi '<'"
      register: _np_t11
      ignore_errors: true
      changed_when: false
      when: _np_longhorn_ns_exists | default(false) | bool

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'longhorn intra-namespace', 'expect': 'reachable', 'pass': (_np_t11.skipped | default(false)) or ((_np_t11.rc | default(-1)) == 0), 'rc': _np_t11.rc | default('skipped')}]}}"

    # system -> application namespace
    # The ingress backend case: a kube-system pod (traefik's position) dials
    # an UNLABELLED backend in a managed namespace.  The managed baseline
    # allows this ingress from system-namespace sources, and the system
    # baseline must allow the egress — without the application-namespace
    # egress rule this is blocked and every ingress route to an app backend
    # returns 502.
    #
    # The probe wgets milliseconds after pod creation; the pod-event path
    # programs enforcement only a few seconds after Ready.  Retry so a
    # legitimately passing path is not recorded as failed by the
    # pod-creation race.
    - name: "test 12/16: kube-system -> app-namespace backend (expect: reachable)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - kube-system
          - np-test-app-backend
          - --image=busybox:1.36
          - --restart=Never
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "n=0; until wget -qO- --timeout=5 http://np-test-server-default.{{_np_test_ns}}.svc.cluster.local:8080/ | grep -q OK; do n=$((n+1)); [ $n -ge 12 ] && exit 1; sleep 5; done"
      register: _np_t12
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'kube-system -> app-namespace backend (ingress-route path)', 'expect': 'reachable', 'pass': (_np_t12.skipped | default(false)) or ((_np_t12.rc | default(-1)) == 0), 'rc': _np_t12.rc | default('skipped')}]}}"

    - name: "test 13/16: kube-system -> Kubernetes API server (expect: reachable)"
      # curlimages/curl + http_code, as test 9: a busybox wget API probe is
      # vacuous (busybox TLS cannot negotiate with kube-apiserver).
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - kube-system
          - api-test-kubesystem
          - --image=curlimages/curl:8.5.0
          - --restart=Never
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "n=0; out=''; until { out=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://{{_np_api_clusterip}}:443/healthz); [ \"$out\" != \"000\" ]; }; do n=$((n+1)); [ $n -ge 12 ] && { echo \"last attempt code: $out\" >&2; exit 1; }; sleep 5; done"
      register: _np_t13
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'kube-system -> Kubernetes API server', 'expect': 'reachable', 'pass': (_np_t13.skipped | default(false)) or ((_np_t13.rc | default(-1)) == 0), 'rc': _np_t13.rc | default('skipped')}]}}"

    - name: "test 14/16: longhorn-system -> Kubernetes API server (expect: reachable)"
      # curlimages/curl + http_code, as tests 9/13.
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - run
          - -n
          - longhorn-system
          - api-test-longhorn
          - --image=curlimages/curl:8.5.0
          - --restart=Never
          - --rm
          - -i
          - --
          - sh
          - "-c"
          - "n=0; out=''; until { out=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://{{_np_api_clusterip}}:443/healthz); [ \"$out\" != \"000\" ]; }; do n=$((n+1)); [ $n -ge 12 ] && { echo \"last attempt code: $out\" >&2; exit 1; }; sleep 5; done"
      register: _np_t14
      ignore_errors: true
      changed_when: false
      when: _np_longhorn_ns_exists | default(false) | bool

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'longhorn-system -> Kubernetes API server', 'expect': 'reachable', 'pass': (_np_t14.skipped | default(false)) or ((_np_t14.rc | default(-1)) == 0), 'rc': _np_t14.rc | default('skipped')}]}}"

    # app namespace -> Kubernetes API
    # Destinations are evaluated post-DNAT (kube-proxy DNATs the API
    # ClusterIP to a node IP on port 6443).  Decision: per-pod opt-in, not
    # baseline blanket node egress (node mgmt IPs share the CIDR) — test 15
    # runs from the labeled client-api pod, test 16 verifies the unlabeled
    # default client stays blocked.
    - name: "test 15/16: api-server-labeled client -> Kubernetes API server (expect: reachable)"
      # Reachability semantics for the API: k3s's /healthz answers 401
      # Unauthorized to an unauthenticated GET, so grepping the response
      # body can never pass even on a healthy path.  Any HTTP status at all
      # proves the request traversed netpol + TLS and the server replied,
      # so the probe accepts any non-000 http_code (000 = curl never got a
      # response: the netpol-DROP/refusal signature).
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-api
          - "--"
          - sh
          - "-c"
          - "n=0; out=''; until { out=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://{{_np_api_clusterip}}:443/healthz); [ \"$out\" != \"000\" ]; }; do n=$((n+1)); [ $n -ge 12 ] && { echo \"last attempt output: $out\" >&2; exit 1; }; sleep 5; done"
      register: _np_t15
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'api-server-labeled client -> Kubernetes API server', 'expect': 'reachable', 'pass': _np_t15.rc == 0, 'rc': _np_t15.rc}]}}"

    # app namespace -> Kubernetes API, unlabeled client
    # The negative of test 15: API egress is an opt-in (allow-api-server-
    # egress), so the generic client must NOT reach the API.  This is a
    # blocked probe — the false-FAIL direction of the event lag (unprogrammed
    # = unfiltered = the request SUCCEEDS inside the ~5s window) — so it
    # retries until blocked, like the other blocked probes.  Runs in the
    # curl-based np-test-client-noapi, not the busybox client: a TLS-crippled
    # wget would record "blocked" even if the path were actually allowed.
    - name: "test 16/16: default client -> Kubernetes API server (expect: blocked)"
      ansible.builtin.command:
        argv:
          - /usr/local/bin/kubectl
          - "--kubeconfig"
          - "{{_k3s_kubecfg}}"
          - exec
          - -n
          - "{{_np_test_ns}}"
          - np-test-client-noapi
          - "--"
          - sh
          - "-c"
          - "n=0; out=''; until { out=$(curl -sk --max-time 5 -o /dev/null -w '%{http_code}' https://{{_np_api_clusterip}}:443/healthz); [ \"$out\" = \"000\" ]; }; do n=$((n+1)); [ $n -ge 12 ] && { echo \"last attempt code: $out\" >&2; exit 1; }; sleep 5; done"
      register: _np_t16
      ignore_errors: true
      changed_when: false

    - set_fact:
        _np_test_results: "{{_np_test_results + [{'name': 'default client -> Kubernetes API server', 'expect': 'blocked', 'pass': _np_t16.rc == 0, 'rc': _np_t16.rc}]}}"

    # summary and assertion
    - name: format test result lines
      set_fact:
        _np_summary_lines: "{{ (_np_summary_lines | default([])) + [line] }}"
      vars:
        line: "  {{ '[PASS]' if item.pass else '[FAIL]' if item.rc != 'skipped' else '[SKIP]' }} {{ item.name }}: expected {{ item.expect }}{% if item.rc != 'skipped' %}, rc={{ item.rc }}{% else %} (skipped){% endif %}"
      loop: "{{_np_test_results}}"
      loop_control:
        label: "{{item.name}}"

    - name: network policy test summary
      debug:
        msg: "{{ ['Network policy tests: ' ~ (_np_test_results | selectattr('pass', 'equalto', true) | list | length) ~ '/' ~ (_np_test_results | list | length) ~ ' passed'] + _np_summary_lines }}"

    - name: assert all network policy tests passed
      assert:
        that: "_np_test_results | selectattr('pass', 'equalto', false) | list | length == 0"
        fail_msg: >-
          Network policy test failures:
          {% for t in _np_test_results | selectattr('pass', 'equalto', false) | list %}
          - {{ t.name }}: expected {{ t.expect }}, rc={{ t.rc }}
          {% endfor %}
        success_msg: "All {{_np_test_results | length}} network policy tests passed."

  always:
    - name: remove test namespace
      kubernetes.core.k8s:
        kubeconfig: "{{_k3s_kubecfg}}"
        state: absent
        definition:
          apiVersion: v1
          kind: Namespace
          metadata:
            name: "{{_np_test_ns}}"
      changed_when: false
