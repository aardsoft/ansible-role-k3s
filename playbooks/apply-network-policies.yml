# Apply k3s NetworkPolicy resources.
#
# This playbook deploys network policies defined in group_vars to all effective
# namespaces, and removes stale ansible-managed policies that are no longer in
# the desired state.  It is a focused subset of the full k3s setup.
#
# Usage:
#   ansible-playbook apply-network-policies.yml
#   ansible-playbook apply-network-policies.yml -l <node>
#
# -l / --limit
#   Restrict to a specific k3s cluster node.  Policy tasks only execute on
#   the first server node, so without -l the play runs against all k3s_nodes
#   but still only acts on the first server.

- name: usage
  hosts: localhost
  gather_facts: false
  tasks:
    - name: apply-network-policies playbook usage
      debug:
        msg:
          - "k3s/playbooks/apply-network-policies.yml — apply k3s NetworkPolicy resources"
          - ""
          - "Options:"
          - "  -l <node>    target a specific k3s node (tasks only run on first server)"
          - ""
          - "Examples:"
          - "  ansible-playbook apply-network-policies.yml -l k3sm3"

- hosts: all,!k3s_pods,!k3s_pod_containers
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: data-utilities
        tasks_from: check_versions
      vars:
        data_utilities_minver: 0.9
    - include_role:
        name: data-utilities
        tasks_from: check_transactional
    - include_role:
        name: data-utilities
        tasks_from: setup_passdb
    - include_role:
        name: data-utilities
        tasks_from: default_variables

- hosts: k3s_nodes
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: k3s
        tasks_from: setup_facts
    - include_role:
        name: k3s
        tasks_from: deploy_network_policies
      when: >
        _k3s_cfg is defined and
        _first_server | default(false) and
        _k3s_cfg.network_policies is defined and
        _k3s_cfg.network_policies.state | default('present') == 'present'
    - include_role:
        name: k3s
        tasks_from: remove_network_policies
      when: >
        _k3s_cfg is defined and
        _first_server | default(false) and
        _k3s_cfg.network_policies is defined and
        _k3s_cfg.network_policies.state | default('present') == 'absent'
