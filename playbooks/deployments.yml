# Run k3s extra deployments (management-ui, kyverno, headlamp, etc.) without
# running a full cluster setup.
#
# This playbook only runs the deployments loop from deploy_on_first.yml —
# it skips cluster bootstrap, infrastructure components, pods, and network
# policies.
#
# Usage:
#   ansible-playbook deployments.yml
#   ansible-playbook deployments.yml -l <node>
#
# -l / --limit
#   Restrict to a specific k3s cluster node.  Deployment tasks only execute
#   on the first server node, so without -l the play runs against all
#   k3s_nodes but still only acts on the first server.
#
# To limit to a specific deployment, set k3s_deployment_limit to a
# deployment name matching a key under k3s.deployments in group_vars.
# Multiple names can be comma-separated.
#

- name: usage
  hosts: localhost
  gather_facts: false
  tasks:
    - name: deployments playbook usage
      debug:
        msg:
          - "k3s/playbooks/deployments.yml — run k3s extra deployments"
          - ""
          - "Options:"
          - "  -l <node>    target a specific k3s node (deployment tasks only run on first server)"
          - ""
          - "Examples:"
          - "  ansible-playbook deployments.yml -l k3sm3"
          - "  ansible-playbook deployments.yml -l k3sm3 -e k3s_deployment_limit=rabbitmq"
          - "  ansible-playbook deployments.yml -l k3sm3 -e 'k3s_deployment_limit=rabbitmq,management-ui'"

- hosts: all,!k3s_pods,!k3s_pod_containers
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: data-utilities
        tasks_from: check_versions
      vars:
        data_utilities_minver: 0.9
    - include_role:
        name: data-utilities
        tasks_from: check_transactional
    - include_role:
        name: data-utilities
        tasks_from: setup_passdb
    - include_role:
        name: data-utilities
        tasks_from: default_variables

- hosts: k3s_nodes
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: k3s
        tasks_from: setup_facts
    - include_role:
        name: k3s
        tasks_from: fix_kyverno_webhook
    - name: run extra deployments
      include_role:
        name: k3s
        tasks_from: deployments
      with_dict: "{{_k3s_cfg.deployments|default({})}}"
      loop_control:
        loop_var: _deployment
      when: >
        _k3s_cfg is defined and
        _first_server | default(false) and
        _k3s_cfg.deployments is defined and
        (k3s_deployment_limit is undefined or
         _deployment.key in (k3s_deployment_limit.split(',') if k3s_deployment_limit is string else k3s_deployment_limit))
