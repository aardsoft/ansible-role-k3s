# Run k3s extra deployments (kyverno, headlamp, arc runners, etc.) without
# running a full cluster setup.
#
# This playbook first applies the minimal infrastructure a deployment needs
# (workload_prerequisites.yml: MetalLB pools, Longhorn StorageClasses,
# Traefik server manifests) plus the cert-manager issuer/certificate config
# (new deployments may need a new issuer or cert from them), then the
# kyverno webhook readiness check, then the deployments loop.  It skips
# cluster bootstrap, component charts (longhorn, cert-manager), pods and
# network policies.
#
# Usage:
#   ansible-playbook deployments.yml -l <first-server>
#
# -l / --limit
#   Deployment tasks execute only on the first server node; limit the run
#   to that node instead of the whole k3s_nodes group.
#
# To limit to a specific deployment, set k3s_deployment_limit to a
# deployment name matching a key under k3s.deployments in group_vars.
# Multiple names can be comma-separated.
#

- name: usage
  hosts: localhost
  gather_facts: false
  tasks:
    - name: deployments playbook usage
      debug:
        msg:
          - "k3s/playbooks/deployments.yml — run k3s extra deployments"
          - ""
          - "Options:"
          - "  -l <first-server>    keep the run to the first server node"
          - ""
          - "Examples:"
          - "  ansible-playbook deployments.yml -l k3sm1 -e k3s_deployment_limit=rabbitmq"
          - "  ansible-playbook deployments.yml -l k3sm1 -e 'k3s_deployment_limit=rabbitmq,management-ui'"

- hosts: all,!k3s_pods,!k3s_pod_containers
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: data-utilities
        tasks_from: check_versions
      vars:
        data_utilities_minver: 0.9
    - include_role:
        name: data-utilities
        tasks_from: check_transactional
    - include_role:
        name: data-utilities
        tasks_from: setup_passdb

- hosts: k3s_nodes
  become: true
  vars:
    ansible_user: management
  tasks:
    - include_role:
        name: k3s
        tasks_from: setup_facts
    - include_role:
        name: k3s
        tasks_from: workload_prerequisites
      when: >
        _k3s_cfg is defined and
        _first_server | default(false)
    - include_role:
        name: k3s
        tasks_from: traefik_label_manifest
    - include_role:
        name: k3s
        tasks_from: configure_cert_manager
      when: >
        _k3s_cfg is defined and
        _first_server | default(false) and
        _k3s_cfg.cert_manager is defined and
        _k3s_cfg.cert_manager.state | default('present') == 'present'
    - include_role:
        name: k3s
        tasks_from: fix_kyverno_webhook
      when: >
        _k3s_cfg is defined and
        _first_server | default(false)
    - name: run extra deployments
      include_role:
        name: k3s
        tasks_from: deployments
      with_dict: "{{_k3s_cfg.deployments|default({})}}"
      loop_control:
        loop_var: _deployment
      when: >
        _k3s_cfg is defined and
        _first_server | default(false) and
        _k3s_cfg.deployments is defined and
        (k3s_deployment_limit is undefined or
         _deployment.key in (k3s_deployment_limit.split(',') if k3s_deployment_limit is string else k3s_deployment_limit))
